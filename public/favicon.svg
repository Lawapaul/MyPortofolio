<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <linearGradient id="brandRingGrad" x1="10" y1="10" x2="150" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F29A4A" />
      <stop offset="100%" stop-color="#E86A33" />
    </linearGradient>
    <linearGradient id="innerPlateGlow" x1="80" y1="36" x2="80" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E86A33" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#E86A33" stop-opacity="0.03" />
    </linearGradient>
    <path id="hssNameCircle" d="M 80,140 A 60,60 0 1,1 79.9,140" fill="none" />
  </defs>

  <!-- Outer Round Emblem Body -->
  <circle cx="80" cy="80" r="77" fill="#0D0E13" stroke="url(#brandRingGrad)" stroke-width="2.5" />
  <circle cx="80" cy="80" r="72" fill="none" stroke="#E86A33" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="2 3" />

  <!-- Inner Monogram Core -->
  <circle cx="80" cy="80" r="43" fill="#14151B" stroke="url(#brandRingGrad)" stroke-width="1.8" />
  <circle cx="80" cy="80" r="43" fill="url(#innerPlateGlow)" />

  <!-- Full Name in Circular Path -->
  <text fill="#F5F3F0" font-family="-apple-system, BlinkMacSystemFont, 'DM Sans', sans-serif" font-size="8.8" font-weight="800" letter-spacing="3.2">
    <textPath href="#hssNameCircle" startOffset="50%" text-anchor="middle">
      HARSHIT SINGH SHEKHAWAT
    </textPath>
  </text>

  <!-- Bottom Accent Pips (No stars) -->
  <circle cx="71" cy="138" r="1.6" fill="#F29A4A" />
  <circle cx="80" cy="140" r="2.4" fill="#E86A33" />
  <circle cx="89" cy="138" r="1.6" fill="#F29A4A" />

  <!-- Center Initials HSS -->
  <text
    x="80"
    y="88.5"
    fill="#F5F3F0"
    font-family="-apple-system, BlinkMacSystemFont, 'DM Sans', sans-serif"
    font-size="26"
    font-weight="900"
    letter-spacing="-0.6"
    text-anchor="middle"
  >
    HSS
  </text>
</svg>